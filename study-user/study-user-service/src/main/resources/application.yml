server:
  port: 9092

spring:
  application:
    name: study-user
  profiles:
    active: local
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public

management:
  endpoints:
    web:
      exposure:
        include: health,info

redis:
  host: 127.0.0.1
  port: 6379
  password:
  cluster: false
  maxTotal: 100
  maxIdle: 30
  minIdle: 10
